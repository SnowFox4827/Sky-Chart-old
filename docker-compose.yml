services:
  starchart:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
    # python:3.12-slim has no curl, so the check uses Python's stdlib.
    # Hits /health inside the container (always port 5000).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
